[project]
name = "strand"
version = "0.1.0"
description = "Visual agentic data pipelines that compile to PySpark + LangGraph and run on Databricks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# What the generated code needs at run time (on Databricks these come from the job environment).
run = [
    "langgraph>=0.2.60",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyspark>=3.5,<4.1",
]

[project.scripts]
strand = "strand.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strand", "src/strand_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
